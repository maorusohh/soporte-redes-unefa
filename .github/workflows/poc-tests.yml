name: POC heartbeat tests

on:
  pull_request:
    paths:
      - "prototype/**"
      - ".github/workflows/poc-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r prototype/requirements.txt
      - name: Run POC tests
        working-directory: prototype
        run: python -m pytest -q

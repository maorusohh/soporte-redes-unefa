name: AUTH-P0 PostgreSQL integration

on:
  push:
    branches:
      - integration/auth-postgres-verification
    paths:
      - "prototype/**"
      - ".github/workflows/auth-postgres-tests.yml"
  pull_request:
    paths:
      - "prototype/**"
      - ".github/workflows/auth-postgres-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unefa_ci
          POSTGRES_DB: unefa_ci
          # Contraseña FICTICIA solo del contenedor efímero en CI.
          POSTGRES_PASSWORD: ci_no_es_un_secreto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unefa_ci -d unefa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No conecta a cuentas ni bases reales; solo service container.
      AUTH_TEST_DATABASE_URL: postgresql://unefa_ci:ci_no_es_un_secreto@127.0.0.1:5432/unefa_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: python -m pip install -r prototype/requirements.txt
      - name: Ejecutar tests existentes e integración real PostgreSQL
        working-directory: prototype
        run: python -m pytest -q
